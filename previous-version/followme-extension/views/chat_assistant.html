<!DOCTYPE html>
<html>
<head>
    <title>FolloMe Chat Assistant</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: 'Inter', sans-serif;
            background: rgba(20, 20, 20, 0.95);
            color: white;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .header img {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }
        .status {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 15px;
            flex-grow: 1;
        }
        .loader {
            border: 2px solid #333;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 5px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        FolloMe Agent
    </div>
    <div class="status" id="status-text">
        <span class="loader" id="loader"></span> Waiting for command...
    </div>
    
    <script>
        // Listen for messages from the parent window or background script
        window.addEventListener('message', (event) => {
            if (event.data && event.data.action === 'UPDATE_STATUS') {
                const statusEl = document.getElementById('status-text');
                const loaderEl = document.getElementById('loader');
                
                statusEl.innerHTML = event.data.statusText;
                
                if (event.data.isLoading) {
                    statusEl.prepend(loaderEl);
                    loaderEl.style.display = 'inline-block';
                } else {
                    loaderEl.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
