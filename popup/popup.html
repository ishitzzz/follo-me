<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FolloMe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#22c55e" xmlns="http://www.w3.org/2000/svg">
            <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.04c.45 0 .67-.54.35-.85L6.35 3.21a.5.5 0 0 0-.85.35Z" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-name">FolloMe</span>
        </div>
      </div>
      <div class="status-dot" id="statusDot"></div>
    </div>

    <!-- Page Info -->
    <div class="page-info" id="pageInfo">
      <div class="page-info-label">Context</div>
      <div class="page-info-title" id="pageTitle">Loading...</div>
      <div class="page-info-url" id="pageUrl"></div>
    </div>

    <!-- Main Action -->
    <button class="btn-main" id="btnAnalyze">
      <div class="btn-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 16v-4"></path>
          <path d="M12 8h.01"></path>
        </svg>
      </div>
      <div class="btn-text">
        <span class="btn-label">Analyze Page</span>
      </div>
      <div class="btn-arrow">→</div>
    </button>

    <!-- Custom Question -->
    <div class="question-box">
      <input type="text" id="questionInput" placeholder="Ask a question..." />
      <button class="btn-ask" id="btnAsk" title="Ask">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    
    <div class="voice-tip"></div>

    <!-- AI Platform Selector -->
    <div class="ai-selector">
      <div class="ai-label">Model</div>
      <div class="ai-options">
        <button class="ai-option active" data-ai="chatgpt">
          <span class="ai-dot chatgpt"></span>
          GPT
        </button>
        <button class="ai-option" data-ai="gemini">
          <span class="ai-dot gemini"></span>
          Gemini
        </button>
        <button class="ai-option" data-ai="claude">
          <span class="ai-dot claude"></span>
          Claude
        </button>
      </div>
    </div>

    <!-- Settings: Groq API Key -->
    <div class="settings-section">
      <div class="settings-header" id="settingsToggle">
        <div class="settings-label">Settings</div>
        <span class="settings-chevron" id="settingsChevron">›</span>
      </div>
      <div class="settings-body" id="settingsBody">
        <div class="key-field">
          <label class="key-label" for="groq-api-key">Groq API Key</label>
          <div class="key-input-row">
            <input type="password" id="groq-api-key" class="key-input" placeholder="gsk_..." autocomplete="off" spellcheck="false" />
            <button class="btn-save-key" id="save-key-btn" title="Save API Key">Save</button>
          </div>
          <div class="key-status" id="keyStatus"></div>
        </div>
      </div>
    </div>

    <!-- Status Message -->
    <div class="status-bar" id="statusBar">
      <div class="status-indicator"></div>
      <span id="statusText">Ready</span>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <span>v1.0.0</span>
      <span id="eventCount">0 events</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
