<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { width: 340px; margin: 0;
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
      background: #0a0a0b; color: #fafafa; }

    header { padding: 16px 16px 12px; }
    .brand { display: flex; flex-direction: column; min-width: 0; gap: 4px; }
    .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 12px;
      letter-spacing: .24em; color: #fafafa; }
    .logo .mark { width: 9px; height: 9px; background: #fff; display: inline-block; }
    .tagline { font-size: 10.5px; color: #8a8a92; letter-spacing: .015em; }
    .sub { font-size: 10.5px; color: #6e6e76; word-break: break-all; }

    .section { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.10); }
    .label { font-size: 9.5px; text-transform: uppercase; letter-spacing: .2em; color: #6e6e76;
      margin-bottom: 9px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    button { border: 0; border-radius: 2px; padding: 9px 12px; font-family: inherit;
      font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      cursor: pointer; transition: opacity .12s ease, background .12s ease, color .12s ease, border-color .12s ease; }
    button:focus-visible { outline: 1px solid #fff; outline-offset: 2px; }
    .primary { background: #fff; color: #0a0a0b; width: 100%; }
    .primary:hover:not(:disabled) { opacity: .85; }
    .primary:disabled { opacity: .4; cursor: default; }
    .ghost { background: transparent; color: #a1a1aa; border: 1px solid rgba(255,255,255,0.14); }
    .ghost:hover { color: #fafafa; border-color: rgba(255,255,255,0.30); }
    .danger { background: transparent; color: #ff8a8a; border: 1px solid rgba(255,107,107,0.30); }
    .danger:hover { color: #ff6b6b; border-color: rgba(255,107,107,0.55); }

    .recipe { background: #141416; border: 1px solid rgba(255,255,255,0.10);
      border-radius: 2px; padding: 10px; margin-bottom: 7px; }
    .recipe.disabled { opacity: .55; }
    .recipe .q { font-size: 12px; line-height: 1.4; }
    .recipe .meta { font-size: 10px; color: #6e6e76; margin-top: 4px; word-break: break-all; letter-spacing: .015em; }
    .recipe .ctl { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
    .recipe .ctl button { padding: 5px 9px; font-size: 9.5px; }
    .stale { color: #e0b070; }
    .badge-off { color: #ff8a8a; }
    .empty { font-size: 11px; color: #6e6e76; letter-spacing: .01em; }

    .row { display: flex; gap: 7px; }
    .row > button { flex: 1; }

    input[type=text] { width: 100%; background: #141416;
      border: 1px solid rgba(255,255,255,0.14); border-radius: 2px; color: #fafafa;
      font-family: inherit; font-size: 11px; padding: 8px 9px; outline: none; }
    input[type=text]:focus { border-color: rgba(255,255,255,0.34); }
    .hint { font-size: 9.5px; color: #6e6e76; margin-top: 6px; letter-spacing: .01em; line-height: 1.5; }
    a { color: #fafafa; text-underline-offset: 2px; }

    /* Backend status — sharp square indicator. */
    .status-line { display: flex; align-items: center; gap: 7px; font-size: 9.5px; color: #8a8a92;
      text-transform: uppercase; letter-spacing: .12em; }
    .dot { width: 7px; height: 7px; background: #3f3f46; flex: none; }
    .dot.online { background: #fafafa; }
    .dot.offline { background: #ff6b6b; }
    .dot.checking { background: #8a8a92; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

    /* Onboarding callout — hairline, monochrome. */
    .onboard { background: #141416; border: 1px solid rgba(255,255,255,0.14);
      border-radius: 2px; padding: 11px; font-size: 11.5px; line-height: 1.55; color: #a1a1aa; }
    .onboard b { color: #fafafa; font-weight: 700; }
    .onboard .row { margin-top: 9px; }
    .onboard button { padding: 6px 12px; font-size: 9.5px; }

    /* Transient toast for import/export feedback */
    .toast { font-size: 10.5px; margin-top: 9px; min-height: 13px; line-height: 1.4;
      word-break: break-word; letter-spacing: .01em; }
    .toast.ok { color: #fafafa; }
    .toast.err { color: #ff8a8a; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo"><i class="mark"></i>MORPH</div>
      <div class="tagline">Reshape any website with a sentence.</div>
      <div class="sub" id="origin">…</div>
    </div>
  </header>

  <div class="section" id="onboardSection" hidden>
    <div class="onboard" id="onboard">
      Press <b>Alt+M</b> on any page to open Morph, then describe how the page should look —
      e.g. <b>“dark mode”</b> or <b>“hide ads”</b>. Your change is saved per site and reapplies on every visit.
      <div class="row">
        <button class="ghost" id="onboardDismiss" aria-label="Dismiss onboarding tip">Got it</button>
      </div>
    </div>
  </div>

  <div class="section">
    <button class="primary" id="openBar">Open Morph on this page · Alt+M</button>
  </div>

  <div class="section" id="authSection" hidden>
    <div class="label">Account</div>
    <div id="authBox"></div>
  </div>

  <div class="section">
    <div class="label">This site</div>
    <div id="current"></div>
  </div>

  <div class="section">
    <div class="label">
      <span>Saved recipes</span>
      <span class="status-line"><span id="recipeCount"></span></span>
    </div>
    <div id="list"></div>
    <div class="row" style="margin-top: 6px;">
      <button class="ghost" id="exportBtn" aria-label="Export all recipes as a JSON file">Export</button>
      <button class="ghost" id="importBtn" aria-label="Import recipes from a JSON file">Import</button>
      <input type="file" id="importFile" accept="application/json" hidden aria-hidden="true" />
    </div>
    <div class="toast" id="ioToast" role="status" aria-live="polite"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
